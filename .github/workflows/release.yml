name: Release

# Runs only by hand, so several merged changes can go out in one release.
on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type to increment'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

# Releases must never run in parallel or be canceled halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dulo-server

jobs:
  release:
    name: Release
    # Releases are cut from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04

    steps:
      # A short-lived token of the release GitHub App. The app is a bypass actor of the main
      # ruleset, so it can push the release commits and tag. The token is revoked when the job ends.
      - name: Create release app token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Determine version policy
        id: version_type
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          case "$VERSION_TYPE" in
            major) policy=SemVerMajorRelease ;;
            minor) policy=SemVerMinorRelease ;;
            # Releases the current snapshot version as is, e.g. 1.2.3-SNAPSHOT -> 1.2.3.
            patch) policy=SemVerPatchDevelopment ;;
            *) echo "Unknown version type: $VERSION_TYPE"; exit 1 ;;
          esac
          echo "Release type: $VERSION_TYPE ($policy)"
          echo "version_type=$VERSION_TYPE" >> "$GITHUB_OUTPUT"
          echo "policy=$policy" >> "$GITHUB_OUTPUT"

      # Release commits and the tag are authored by the app's bot user, e.g. dulo-release[bot].
      - name: Set up Git
        env:
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${bot}" --jq .id)
          git config --local user.name "$bot"
          git config --local user.email "${bot_id}+${bot}@users.noreply.github.com"

      # Sets the release version and runs the full build with all tests on it (preparationGoals).
      # Only when that passes does it commit and tag the release version, commit the next
      # -SNAPSHOT version and push both commits and the tag. release:perform is not needed: it
      # would only deploy to a Maven repository, and the release ships as an image and a JAR.
      - name: Prepare release
        id: prepare
        env:
          RELEASE_POLICY: ${{ steps.version_type.outputs.policy }}
        run: |
          ./mvnw -B release:prepare -DreleaseType="$RELEASE_POLICY"
          tag=$(grep '^scm.tag=' release.properties | cut -d= -f2)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The working tree is now at the next -SNAPSHOT version. The image is built from the tag.
      # The release JAR stays in target/ from the build in the previous step.
      - name: Check out release tag
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: git checkout "$TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.prepare.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.prepare.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "Dulo Server $VERSION" \
            --generate-notes \
            "dulo-service/target/dulo-server-$VERSION.jar" \
            "schema/dulo-config.schema.json"

      - name: Print release info
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
          VERSION_TYPE: ${{ steps.version_type.outputs.version_type }}
        run: |
          {
            echo "## Release $TAG"
            echo ""
            echo "- **Type**: $VERSION_TYPE"
            echo "- **Image**: \`$IMAGE:$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
