name: Release

# Runs only by hand, so several merged changes can go out in one release.
on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type to increment'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

# Releases must never run in parallel or be canceled halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dulo-server

jobs:
  release:
    name: Release
    # Releases are cut from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04

    steps:
      # RELEASE_TOKEN must be allowed to push to the protected main branch
      # (a GitHub App token or a PAT of a user who can bypass the branch protection).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Determine version policy
        id: version_type
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          case "$VERSION_TYPE" in
            major) policy=SemVerMajorRelease ;;
            minor) policy=SemVerMinorRelease ;;
            # Releases the current snapshot version as is, e.g. 1.2.3-SNAPSHOT -> 1.2.3.
            patch) policy=SemVerPatchDevelopment ;;
            *) echo "Unknown version type: $VERSION_TYPE"; exit 1 ;;
          esac
          echo "Release type: $VERSION_TYPE ($policy)"
          echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT
          echo "policy=$policy" >> $GITHUB_OUTPUT

      # Signs the release commits and tags. The git user name and email come from the key.
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      # Sets the release version, tags it and bumps to the next snapshot version.
      # Tests already ran on the pull request.
      - name: Prepare release
        id: prepare
        run: |
          ./mvnw -B release:prepare \
            -DreleaseType=${{ steps.version_type.outputs.policy }} \
            -Darguments="-DskipTests -Dfmt.skip"
          tag=$(grep '^scm.tag=' release.properties | cut -d= -f2)
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "version=${tag#v}" >> $GITHUB_OUTPUT

      - name: Build release JAR
        run: |
          git checkout "${{ steps.prepare.outputs.tag }}"
          ./mvnw -B -q -pl dulo-service -am package -DskipTests -Dfmt.skip

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.prepare.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.prepare.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.prepare.outputs.tag }}"
          version="${{ steps.prepare.outputs.version }}"
          gh release create "$tag" \
            --verify-tag \
            --title "Dulo Server $version" \
            --generate-notes \
            "dulo-service/target/dulo-server-$version.jar" \
            "schema/dulo-config.schema.json"

      - name: Print release info
        run: |
          echo "## Release ${{ steps.prepare.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ steps.version_type.outputs.version_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.IMAGE }}:${{ steps.prepare.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
