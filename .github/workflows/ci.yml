name: CI

# Pull requests only: main changes only through pull requests, and the Release workflow runs
# the full build again before it releases.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Format check (validate phase), unit, architecture and integration tests.
      # Integration tests start PostgreSQL and MySQL with Testcontainers.
      - name: Build and test
        run: ./mvnw -B verify

      # Unit and integration test coverage of all modules, from dulo-service/target/site/jacoco-aggregate.
      - name: Coverage gate
        env:
          COVERAGE_MIN_BRANCH: '70'
          COVERAGE_MIN_LINE: '85'
        run: python3 .github/scripts/coverage-gate.py dulo-service/target/site/jacoco-aggregate/jacoco.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: dulo-service/target/site/jacoco-aggregate/
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/*-reports/'
          retention-days: 14

  docs:
    name: Docs
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Fails on Javadoc errors and warnings, so the docs published on release always build.
      # The build job runs the tests, so they're skipped here.
      - name: Build site
        run: ./mvnw -B -DskipTests package site site:stage

  docker:
    name: Docker image
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: dulo-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name dulo -p 8080:8080 dulo-server:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' dulo)
            if [ "$status" = "healthy" ]; then
              echo "✅ Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Container did not become healthy"
          docker logs dulo
          exit 1

      - name: Print image size
        run: |
          echo "## Docker image" >> "$GITHUB_STEP_SUMMARY"
          docker images dulo-server:ci --format 'Size: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
