name: CI

# Pull requests only: main changes only through pull requests, and the Release workflow runs
# the full build again before it releases.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Format check (validate phase), unit, architecture and integration tests.
      # Integration tests start PostgreSQL and MySQL with Testcontainers.
      - name: Build and test
        run: ./mvnw -B verify

      # Starts the server JAR the way the Docker image of the web client runs it.
      - name: Smoke test JAR
        run: |
          log="$RUNNER_TEMP/server.log"
          DULO_DATA_DIR="$RUNNER_TEMP/data" java -jar dulo-service/target/dulo-server-*.jar > "$log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/actuator/health/liveness; then
              echo "✅ Server is up"
              kill %1
              exit 0
            fi
            sleep 2
          done
          echo "❌ Server did not start"
          cat "$log"
          exit 1

      # Unit and integration test coverage of all modules, from dulo-service/target/site/jacoco-aggregate.
      - name: Coverage gate
        env:
          COVERAGE_MIN_BRANCH: '70'
          COVERAGE_MIN_LINE: '85'
        run: python3 .github/scripts/coverage-gate.py dulo-service/target/site/jacoco-aggregate/jacoco.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: dulo-service/target/site/jacoco-aggregate/
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/*-reports/'
          retention-days: 14

  docs:
    name: Docs
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Fails on Javadoc errors and warnings, so the docs published on release always build.
      # The build job runs the tests, so they're skipped here.
      - name: Build site
        run: ./mvnw -B -DskipTests package site site:stage
