# Dulo with a self-hosted Pocket ID identity provider and a YAML config file.
#   docker compose -f pocket-id.yaml up -d
#
# 1. Open Pocket ID, create an OIDC client for Dulo with the callback URL
#    http://localhost:8080/login/oauth2/code/pocketid and copy its client id and secret below.
# 2. Put users who should administer the tree in a Pocket ID group named family-admins.
# See the Pocket ID documentation for its own settings.
services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    restart: unless-stopped
    ports:
      - "1411:1411"
    environment:
      APP_URL: http://localhost:1411
      TRUST_PROXY: "false"
    volumes:
      - pocket-id-data:/app/data

  dulo:
    image: ghcr.io/rdlf0/dulo-server:latest
    restart: unless-stopped
    depends_on:
      - pocket-id
    ports:
      - "8080:8080"
    environment:
      DULO_PUBLIC_URL: http://localhost:8080
      # Environment variables override the file, e.g. to keep secrets out of it.
      DULO_IDENTITY_PROVIDERS_POCKETID_CLIENTSECRET: change-me
    configs:
      - source: dulo-config
        target: /config/dulo.yaml
    volumes:
      - dulo-data:/data

configs:
  dulo-config:
    content: |
      dulo:
        identity:
          providers:
            pocketid:
              type: oidc
              display-name: Pocket ID
              issuer-uri: http://pocket-id:1411
              client-id: change-me
              role-mappings:
                family-admins: [admin]
              default-role: viewer

volumes:
  pocket-id-data:
  dulo-data:
