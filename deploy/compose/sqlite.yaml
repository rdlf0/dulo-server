# Dulo with a SQLite database stored in a Docker volume.
#   docker compose -f sqlite.yaml up -d
services:
  dulo:
    image: ghcr.io/rdlf0/dulo-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DULO_PUBLIC_URL: http://localhost:8080
    volumes:
      - dulo-data:/data

volumes:
  dulo-data:
