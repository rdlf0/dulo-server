# Dulo with PostgreSQL.
#   docker compose -f postgres.yaml up -d
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dulo
      POSTGRES_USER: dulo
      POSTGRES_PASSWORD: change-me
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dulo -d dulo"]
      interval: 5s
      timeout: 5s
      retries: 10

  dulo:
    image: ghcr.io/rdlf0/dulo-server:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DULO_PUBLIC_URL: http://localhost:8080
      DULO_DATABASE_URL: jdbc:postgresql://db:5432/dulo
      DULO_DATABASE_USERNAME: dulo
      DULO_DATABASE_PASSWORD: change-me

volumes:
  db-data:
